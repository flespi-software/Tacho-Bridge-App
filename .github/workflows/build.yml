name: Build TBA (Windows amd64 + Ubuntu 22.04 amd64 + macOS universal)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-universal:
    name: macOS universal (x86_64 + arm64 DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri - universal)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload universal DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: tba-macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows-amd64:
    name: Windows amd64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v5
        with:
          name: tba-windows-amd64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  ubuntu-2204-amd64:
    name: Ubuntu 22.04 amd64 (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Tauri + PCSC + AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget pkg-config file \
            libssl-dev libxdo-dev libudev-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools fuse \
            pcscd libpcsclite-dev libccid usbutils

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v5
        with:
          name: tba-ubuntu-2204-amd64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release (on v* tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-universal, windows-amd64, ubuntu-2204-amd64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          fail_on_unmatched_files: true