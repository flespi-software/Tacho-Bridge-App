name: Build TBA (Windows amd64 + Ubuntu 22.04 amd64)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    name: Windows amd64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tba-windows-amd64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  ubuntu-2204-amd64:
    name: Ubuntu 22.04 amd64 (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri + PCSC + AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget pkg-config file \
            libssl-dev libxdo-dev libudev-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            squashfs-tools fuse \
            pcscd libpcsclite-dev libccid usbutils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tba-ubuntu-2204-amd64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14