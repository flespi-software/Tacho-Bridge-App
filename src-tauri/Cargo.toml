[package]
name = "tacho-bridge-application"
version = "0.8.0-beta.8"
description = "Tachograph authentication application"
authors = ["Shatilo Evgeny"]
license = ""
repository = "https://git.gurtam.net/shev/flespi_tca"
edition = "2021"
rust-version = "1.84.0"
# Pin the app binary so `cargo run` / `tauri dev` always select it even when
# extra local-only binaries exist under src/bin/ (which is git-ignored).
default-run = "tacho-bridge-application"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.43.0", features = ["full"] }
tauri = { version = "2.2.4", features = ["tray-icon"] }
reqwest = { version = "0.13.2", features = ["json"] }
log = "0.4"
tauri-plugin-log = "2.0.0-rc"
pcsc = "2.9.0"
hex = "0.4.3"
rumqttc = "0.25.1"
fern = "0.7.1"
chrono = "0.4.39"
serde_yaml = "0.9.34"
lazy_static = "1.5.0"
native-tls = "0.2.13"
tokio-native-tls = "0.3.1"
sys-info = "0.9.1"
once_cell = "1.21.3"
tokio-serial = "5.4.5"
serialport = "4.8.1"
# Log upload for the fetch_logs server command: the log slice is delivered as
# a zip archive (the server-side media pipeline accepts zip only).
zip = { version = "8", default-features = false, features = ["deflate"] }
# A second running instance can't share the rack's COM port (exclusive open on
# Windows) — it just fights the first one for it. Block it and focus the
# existing window instead.
tauri-plugin-single-instance = "2"
# Self-update from GitHub releases (latest.json + minisign-signed artifacts).
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2.5.1"

# Windows only: the serial-port layer there reports the FTDI driver's strings,
# not the device's own USB descriptors. nusb reads the real iProduct/serial
# from the parent USB node (no device open, no extra drivers) so the rack can
# be identified by the strings Lisle programs into the chip EEPROM.
[target.'cfg(windows)'.dependencies]
nusb = "0.2.5"

